<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Be My Valentine?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              dreamy: '0 25px 70px rgba(236, 72, 153, 0.25)',
            },
            fontFamily: {
              display: ['"Poppins"', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./public/css/style.css" />
  </head>
  <body class="font-display min-h-screen overflow-hidden bg-gradient-to-br from-rose-100 via-pink-50 to-fuchsia-100 text-slate-800">
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="heart-float absolute left-10 top-16 text-4xl text-pink-300/70">❤</div>
      <div class="heart-float absolute right-10 top-24 text-5xl text-rose-300/80" style="animation-delay: 1s;">❤</div>
      <div class="heart-float absolute left-1/4 bottom-20 text-3xl text-pink-400/60" style="animation-delay: 2s;">❤</div>
      <div class="heart-float absolute right-1/4 bottom-16 text-4xl text-fuchsia-300/70" style="animation-delay: 3s;">❤</div>
    </div>

    <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10">
      <div class="container w-full max-w-xl rounded-[32px] border border-white/70 bg-white/70 p-6 shadow-dreamy backdrop-blur-xl sm:p-10">
        <div class="banner-gif mb-6 flex justify-center">
          <img id="banner" src="./public/images/mid.gif" alt="banner" class="h-56 w-auto drop-shadow-[0_18px_30px_rgba(236,72,153,0.32)] sm:h-64" />
        </div>

        <h1 id="question-heading" class="text-center text-3xl font-black tracking-tight text-rose-600 sm:text-5xl">
          Will you be my valentine?
        </h1>

        <div class="buttons mt-8 flex flex-wrap items-center justify-center gap-4">
          <button id="yes-button" class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-pink-500 via-rose-500 to-fuchsia-500 px-7 py-3 text-lg font-bold text-white shadow-[0_18px_30px_rgba(244,114,182,0.42)] transition-all duration-300 hover:scale-105 hover:shadow-[0_20px_40px_rgba(244,114,182,0.45)]">
            Yes
          </button>
          <button id="no-button" class="inline-flex items-center justify-center rounded-full border border-rose-200 bg-white/90 px-6 py-3 text-lg font-semibold text-rose-500 shadow-sm transition-all duration-300 hover:scale-105 hover:bg-rose-50">
            No
          </button>
        </div>

        <div class="message mt-6 hidden rounded-3xl border border-pink-100 bg-gradient-to-r from-pink-50 to-rose-50 p-5 text-center shadow-inner">
          <h2 id="success-message" class="text-2xl font-bold text-rose-600">Yepppie, see you sooonnn :3</h2>
          <p class="mt-2 text-sm text-slate-600">You just made my whole heart skip a beat 💗</p>
          <h6 class="mt-4 text-[11px] font-medium uppercase tracking-[0.22em] text-slate-500">
            Creator:
            <a class="creator ml-1 text-rose-500 transition hover:text-rose-600" href="https://github.com/Aayush-683">Aayush683 ;)</a>
          </h6>
        </div>

        <div class="language-selector mt-8 flex flex-col items-center justify-center gap-2 sm:flex-row">
          <label for="language-select" class="text-sm font-medium text-slate-600">Choose Language:</label>
          <select id="language-select" onchange="changeLanguage()" class="rounded-full border border-rose-200 bg-white/90 px-3 py-2 text-sm text-slate-700 shadow-sm outline-none transition focus:border-rose-400 focus:ring-2 focus:ring-pink-200">
            <option value="english">English</option>
            <option value="french">French</option>
            <option value="thai">แบบไทย</option>
          </select>
        </div>
      </div>
    </main>

    <script src="./public/js/script.js"></script>
  </body>
</html>
